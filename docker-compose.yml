services:
  mysql:
    image: mysql:8.0
    container_name: maoyouji-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: maoyouji_root
      MYSQL_DATABASE: maoyouji
      MYSQL_USER: maoyouji
      MYSQL_PASSWORD: maoyouji_dev
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmaoyouji_root"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
